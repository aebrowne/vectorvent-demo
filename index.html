<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VectorVent - 3D Airflow & Physics Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb; /* Sky Blue Fallback */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f3f4f6;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Floating UI Panels */
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: absolute;
            z-index: 10;
        }

        /* Bottom Left Controls (Compacted Size) */
        #ui-controls {
            bottom: 20px;
            left: 20px;
            width: 240px;
            padding: 12px;
            pointer-events: auto;
            max-height: 85vh;
            overflow-y: auto;
        }

        h1 { margin: 0 0 3px 0; font-size: 13px; font-weight: 700; color: #60a5fa; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 9px; color: #9ca3af; margin-bottom: 10px; line-height: 1.3; }
        
        .control-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 3px; }
        label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #d1d5db; font-weight: 700; display: flex; justify-content: space-between; }
        select, input[type="range"], input[type="password"] { 
            width: 100%; background: #374151; border: 1px solid #4b5563; color: white; padding: 5px; border-radius: 6px; outline: none; 
            transition: border-color 0.2s;
            font-size: 10px;
        }
        select:focus, input[type="password"]:focus { border-color: #3b82f6; }
        
        hr { border: 0; border-top: 1px solid #374151; margin: 8px 0; }
        .api-status { display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; }
        .status-dot.active { background: #10b981; box-shadow: 0 0 6px #10b981; }
        .status-dot.processing { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }

        /* Top Center Telemetry & State Overlay */
        #ui-telemetry {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            padding: 14px 20px;
            min-width: 680px;
        }
        
        .state-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #374151;
        }

        .info-title { font-size: 9px; color: #9ca3af; margin-bottom: 3px; text-transform: uppercase; font-weight: bold; }
        .info-status { font-size: 13px; color: #10b981; font-weight: bold; }
        
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }
        
        .telemetry-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 6px; 
            border-right: 1px solid #374151; 
            padding: 0 8px; 
            transition: all 0.3s ease;
        }
        .telemetry-item:last-child { border-right: none; }
        .telemetry-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; font-weight: bold; text-align: center; }
        .telemetry-value { font-size: 18px; font-family: monospace; font-weight: 600; color: #38bdf8; }
        
        /* Expandable Manual Overrides inside Telemetry */
        .override-slider-container {
            width: 100%;
            height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .show-overrides .override-slider-container {
            height: 26px;
            opacity: 1;
            margin-top: 4px;
        }
        
        .telemetry-slider {
            width: 90%;
            height: 4px;
            accent-color: #3b82f6;
        }

        /* Bottom Right: Thought Process */
        #ui-thought {
            bottom: 20px;
            right: 20px;
            width: 260px;
            padding: 12px;
        }

        #thought-process {
            margin-top: 6px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            font-family: monospace;
            font-size: 9px;
            color: #a7f3d0;
            min-height: 70px;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 130px;
        }

        /* Bottom Center Instructions */
        .instructions { 
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px; 
            color: #111827; 
            font-weight: 600;
            text-align: center; 
            z-index: 5;
            text-shadow: 0px 1px 3px rgba(255,255,255,0.8);
            pointer-events: none;
        }
    </style>
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- BOTTOM LEFT: VECTORVENT ENGINE DATA PANEL -->
    <div id="ui-controls" class="glass-panel">
        <h1>VectorVent Engine</h1>
        <p>Intent-driven 3D atmospheric control.</p>
        
        <div class="control-group">
            <label>
                <span>Gemini API Key</span>
                <div class="api-status"><div class="status-dot" id="api-indicator"></div></div>
            </label>
            <input type="password" id="api-key" placeholder="Auto-injected by Canvas environment">
        </div>

        <div class="control-group">
            <label for="ai-mode">AI Intent Mode</label>
            <select id="ai-mode">
                <option value="smoke_evac">Targeted Smoke/Odor Evacuation</option>
                <option value="anti_buffeting">Active Anti-Buffeting (Unlock Overrides)</option>
                <option value="gentle_breeze">Gentle Cabin Breeze</option>
                <option value="thermal_shed">Predictive Thermal Shedding</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="speed-slider">Vehicle Speed (MPH): <span id="speed-val">65</span></label>
            <input type="range" id="speed-slider" min="0" max="100" step="5" value="65">
        </div>
        
        <div class="control-group">
            <label for="wind-angle">Ambient Wind Angle: <span id="wind-val">45°</span></label>
            <input type="range" id="wind-angle" min="0" max="360" step="15" value="45">
        </div>
    </div>

    <!-- TOP CENTER: UNIFIED TELEMETRY & APERTURE STATE -->
    <div id="ui-telemetry" class="glass-panel">
        <div class="state-header">
            <div>
                <div class="info-title">CALCULATED STATE</div>
                <div class="info-status" id="calc-state">Initializing...</div>
            </div>
            <div style="text-align: right;">
                <div class="info-title">CFM EXCHANGE RATE</div>
                <div class="info-status" id="cfm-rate" style="color:#f59e0b;">0 CFM</div>
            </div>
        </div>
        
        <div class="telemetry-grid" id="telemetry-grid-container">
            <div class="telemetry-item">
                <span class="telemetry-label">Front Left</span>
                <span class="telemetry-value" id="disp-fl">0%</span>
                <div class="override-slider-container">
                    <input type="range" class="telemetry-slider" id="manual-fl" min="0" max="100" value="0">
                </div>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Front Right</span>
                <span class="telemetry-value" id="disp-fr">0%</span>
                <div class="override-slider-container">
                    <input type="range" class="telemetry-slider" id="manual-fr" min="0" max="100" value="0">
                </div>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Rear Left</span>
                <span class="telemetry-value" id="disp-rl">0%</span>
                <div class="override-slider-container">
                    <input type="range" class="telemetry-slider" id="manual-rl" min="0" max="100" value="0">
                </div>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Rear Right</span>
                <span class="telemetry-value" id="disp-rr">0%</span>
                <div class="override-slider-container">
                    <input type="range" class="telemetry-slider" id="manual-rr" min="0" max="100" value="0">
                </div>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Sunroof</span>
                <span class="telemetry-value" id="disp-sr" style="color:#a7f3d0;">0%</span>
                <div class="override-slider-container">
                    <input type="range" class="telemetry-slider" id="manual-sr" min="0" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM RIGHT: THOUGHT PROCESS -->
    <div id="ui-thought" class="glass-panel">
        <div class="info-title">AI THOUGHT PROCESS</div>
        <div id="thought-process">Awaiting telemetry...</div>
    </div>

    <!-- CANVAS INSTRUCTIONS -->
    <div class="instructions">
        Click & Drag canvas to rotate camera. Scroll to zoom.
    </div>

    <!-- 3D CANVAS -->
    <div id="canvas-container"></div>

<script>
    // =======================================================
    // 1. THE PHYSICS ENGINE (Local Fallback)
    // =======================================================
    class VectorVentPhysics {
        constructor() {
            this.windowNormals = {
                fl: this.normalize([-1.0,  0.15]), 
                fr: this.normalize([ 1.0,  0.15]), 
                rl: this.normalize([-1.0, -0.05]), 
                rr: this.normalize([ 1.0, -0.05])  
            };
        }

        normalize(vec) {
            const mag = Math.sqrt(vec[0]*vec[0] + vec[1]*vec[1]);
            return [vec[0]/mag, vec[1]/mag];
        }

        dotProduct(v1, v2) {
            return (v1[0] * v2[0]) + (v1[1] * v2[1]);
        }

        calculateRelativeWind(vehSpeed, windSpeed, windAngleDeg) {
            const vVeh = [0, vehSpeed];
            const windRad = windAngleDeg * (Math.PI / 180);
            const vAmbient = [
                -windSpeed * Math.sin(windRad), 
                -windSpeed * Math.cos(windRad)
            ];
            const vRel = [
                vVeh[0] - vAmbient[0], 
                vVeh[1] - vAmbient[1]
            ];
            const relSpeed = Math.sqrt(vRel[0]*vRel[0] + vRel[1]*vRel[1]);
            const relDir = this.normalize(vRel);

            return { speed: relSpeed, direction: relDir };
        }

        calculatePressures(relWindDir) {
            let cpMap = {};
            for (let window in this.windowNormals) {
                const normal = this.windowNormals[window];
                cpMap[window] = this.dotProduct(relWindDir, normal);
            }
            return cpMap;
        }

        solveApertures(mode, vehSpeed, windSpeed, windAngleDeg, locks) {
            const relWind = this.calculateRelativeWind(vehSpeed, windSpeed, windAngleDeg);
            const cpMap = this.calculatePressures(relWind.direction);
            
            let targets = { 
                fl: locks.fl.isLocked ? locks.fl.val : 0, 
                fr: locks.fr.isLocked ? locks.fr.val : 0, 
                rl: locks.rl.isLocked ? locks.rl.val : 0, 
                rr: locks.rr.isLocked ? locks.rr.val : 0,
                sr: locks.sr.isLocked ? locks.sr.val : 0
            };
            
            let cfm = 0;
            let activeState = "";
            let reasoning = "";

            const leftIsWindward = cpMap.fl > cpMap.fr;

            if (mode === 'smoke_evac') {
                activeState = "High-Velocity Cross-Flow";
                if (leftIsWindward) {
                    if(!locks.fl.isLocked) targets.fl = 15; 
                    if(!locks.rr.isLocked) targets.rr = 60 + (Math.abs(cpMap.rr) * 20); 
                    if(!locks.sr.isLocked) targets.sr = 30; 
                } else {
                    if(!locks.fr.isLocked) targets.fr = 15; 
                    if(!locks.rl.isLocked) targets.rl = 60 + (Math.abs(cpMap.rl) * 20); 
                    if(!locks.sr.isLocked) targets.sr = 30;
                }
                cfm = Math.floor(relWind.speed * 4.8);
                reasoning = "[Fallback Math Engine] Established cross-flow vacuum via side windows while utilizing sunroof top-suction for rapid volumetric extraction.";
            } 
            else if (mode === 'anti_buffeting') {
                activeState = "Helmholtz Suppression";
                let maxSideOpen = Math.max(targets.fl, targets.fr, targets.rl, targets.rr);
                
                if (maxSideOpen > 20) {
                    if(!locks.sr.isLocked) targets.sr = maxSideOpen * 0.6; 
                    reasoning = "[Fallback Math Engine] Detected user manual override opening side glass. Actively adjusting sunroof exhaust to balance pressure and eliminate low-frequency buffeting.";
                } else {
                    const drop = Math.min(8, Math.max(2, relWind.speed * 0.05));
                    if(!locks.fl.isLocked) targets.fl = drop;
                    if(!locks.fr.isLocked) targets.fr = drop;
                    if(!locks.rl.isLocked) targets.rl = drop;
                    if(!locks.rr.isLocked) targets.rr = drop;
                    reasoning = "[Fallback Math Engine] Applying uniform micro-drops to disrupt shear-layer vortex shedding at current speed.";
                }
                cfm = Math.floor(relWind.speed * 0.5);
            }
            else if (mode === 'thermal_shed') {
                activeState = "Thermal Chimney Effect";
                if(!locks.sr.isLocked) targets.sr = 80; 
                if(!locks.fl.isLocked) targets.fl = 10; 
                if(!locks.fr.isLocked) targets.fr = 10;
                cfm = Math.floor(relWind.speed * 3.0 + 150); 
                reasoning = "[Fallback Math Engine] Maximized sunroof tilt/slide to establish vertical convective flow. Cracked lower windows for ambient intake.";
            }
            else if (mode === 'gentle_breeze') {
                activeState = "Low-Velocity Circulation";
                if (leftIsWindward) {
                    if(!locks.fr.isLocked) targets.fr = 10; 
                    if(!locks.rl.isLocked) targets.rl = 5;  
                } else {
                    if(!locks.fl.isLocked) targets.fl = 10; 
                    if(!locks.rr.isLocked) targets.rr = 5;
                }
                cfm = Math.floor(relWind.speed * 1.5);
                reasoning = "[Fallback Math Engine] Balanced high and low pressure coefficients to generate draft-free ambient circulation.";
            }

            for(let key in targets) {
                targets[key] = Math.max(0, Math.min(100, targets[key]));
            }

            return { targets, cfm, activeState, reasoning };
        }
    }

    const physicsEngine = new VectorVentPhysics();

    // =======================================================
    // 2. THREE.JS 3D SCENE SETUP
    // =======================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Light blue daytime sky
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(-15, 6, 18);
    camera.lookAt(0, 0, 0); 
    
    // Shift camera frustum to place horizon at 4/10ths down from the top
    camera.setViewOffset(window.innerWidth, window.innerHeight, 0, window.innerHeight * 0.1, window.innerWidth, window.innerHeight);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    let controls;
    try {
        if (typeof THREE.OrbitControls !== 'undefined') {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 8;
            controls.maxDistance = 40;
            controls.target.set(0, 0, 0);
        }
    } catch(e) {
        console.warn("OrbitControls failed to load.", e);
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(15, 30, 15); 
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- Ground Planes ---
    const grassGeo = new THREE.PlaneGeometry(200, 200);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 1.0 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -1.72; 
    scene.add(grass);

    const roadGeo = new THREE.PlaneGeometry(12, 200); 
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = -1.7; 
    scene.add(road);

    // ==========================================
    // DETAILED GHOSTED CAR MODEL
    // ==========================================
    const carGroup = new THREE.Group();
    scene.add(carGroup);
    
    const chassisMat = new THREE.MeshStandardMaterial({ 
        color: 0x9ca3af, metalness: 0.5, roughness: 0.3, 
        transparent: true, opacity: 0.4 
    });
    
    const windowMat = new THREE.MeshStandardMaterial({ 
        color: 0x3b82f6, metalness: 0.9, roughness: 0.1, 
        transparent: true, opacity: 0.85, emissive: 0x1d4ed8, emissiveIntensity: 0.4, side: THREE.DoubleSide
    });

    const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); 
    const taillightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 

    // Lower Body (Chassis)
    const bodyGeo = new THREE.BoxGeometry(4.2, 1.2, 10);
    const bodyMesh = new THREE.Mesh(bodyGeo, chassisMat);
    bodyMesh.position.y = -0.3; 
    carGroup.add(bodyMesh);

    // Hollow Cabin Roof Frame
    const roofLeft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 4.4), chassisMat);
    roofLeft.position.set(1.65, 1.7, -0.5);
    const roofRight = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 4.4), chassisMat);
    roofRight.position.set(-1.65, 1.7, -0.5);
    const roofFront = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 0.4), chassisMat);
    roofFront.position.set(0, 1.7, 1.5);
    const roofRear = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 0.4), chassisMat);
    roofRear.position.set(0, 1.7, -2.5);
    carGroup.add(roofLeft, roofRight, roofFront, roofRear);

    // Windshields 
    const windshieldGeo = new THREE.PlaneGeometry(3.4, 1.72); 
    const windshield = new THREE.Mesh(windshieldGeo, windowMat);
    windshield.position.set(0, 1.0, 2.0);
    windshield.rotation.x = -0.62; 
    carGroup.add(windshield);

    const rearWindowGeo = new THREE.PlaneGeometry(3.4, 1.72);
    const rearWindow = new THREE.Mesh(rearWindowGeo, windowMat);
    rearWindow.position.set(0, 1.0, -3.0);
    rearWindow.rotation.x = 0.62; 
    carGroup.add(rearWindow);

    // Dynamic 4-Door Side Glass
    const sideWindowGeo = new THREE.PlaneGeometry(2.0, 1.4);
    const windows = {
        fl: new THREE.Mesh(sideWindowGeo, windowMat),
        fr: new THREE.Mesh(sideWindowGeo, windowMat),
        rl: new THREE.Mesh(sideWindowGeo, windowMat),
        rr: new THREE.Mesh(sideWindowGeo, windowMat),
        sr: new THREE.Group()
    };

    windows.fl.position.set(1.81, 1.0, 0.5);
    windows.fl.rotation.y = Math.PI / 2;
    windows.fr.position.set(-1.81, 1.0, 0.5);
    windows.fr.rotation.y = -Math.PI / 2;
    
    windows.rl.position.set(1.81, 1.0, -1.5);
    windows.rl.rotation.y = Math.PI / 2;
    windows.rr.position.set(-1.81, 1.0, -1.5);
    windows.rr.rotation.y = -Math.PI / 2;
    carGroup.add(windows.fl, windows.fr, windows.rl, windows.rr);

    // Sunroof Assembly
    const srFrameGeo = new THREE.BoxGeometry(3.0, 0.02, 1.5); 
    const srGlassGeo = new THREE.BoxGeometry(2.8, 0.04, 1.3); 

    const fixedSrGroup = new THREE.Group();
    const fixedSrFrame = new THREE.Mesh(srFrameGeo, blackMat);
    const fixedSrGlass = new THREE.Mesh(srGlassGeo, windowMat);
    fixedSrGroup.add(fixedSrFrame, fixedSrGlass);
    fixedSrGroup.position.set(0, 1.7, -1.25);
    carGroup.add(fixedSrGroup);

    const movingSrFrame = new THREE.Mesh(srFrameGeo, blackMat);
    const movingSrGlass = new THREE.Mesh(srGlassGeo, windowMat);
    windows.sr.add(movingSrFrame, movingSrGlass);
    windows.sr.position.set(0, 1.72, 0.25); 
    carGroup.add(windows.sr);

    // Wheels & Lights
    const wheelGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.4, 32);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelPositions = [
        [-2.1, -1.0, 3.0], [2.1, -1.0, 3.0],
        [-2.1, -1.0, -3.0], [2.1, -1.0, -3.0]
    ];
    wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, blackMat);
        wheel.position.set(...pos);
        carGroup.add(wheel);
    });

    const hlGeo = new THREE.BoxGeometry(0.8, 0.4, 0.1);
    const frontLeftLight = new THREE.Mesh(hlGeo, headlightMat);
    frontLeftLight.position.set(1.3, -0.1, 5.01);
    const frontRightLight = new THREE.Mesh(hlGeo, headlightMat);
    frontRightLight.position.set(-1.3, -0.1, 5.01);
    carGroup.add(frontLeftLight, frontRightLight);

    const tlGeo = new THREE.BoxGeometry(1.0, 0.3, 0.1);
    const rearLeftLight = new THREE.Mesh(tlGeo, taillightMat);
    rearLeftLight.position.set(1.4, -0.1, -5.01);
    const rearRightLight = new THREE.Mesh(tlGeo, taillightMat);
    rearRightLight.position.set(-1.4, -0.1, -5.01);
    carGroup.add(rearLeftLight, rearRightLight);

    // ==========================================
    // WAVY WIND LINES (80 count, 30% slowed speed)
    // ==========================================
    class WavyWindCurve extends THREE.Curve {
        getPoint(t, optionalTarget = new THREE.Vector3()) {
            const z = (t - 0.5) * 6; 
            const y = Math.sin(t * Math.PI * 6) * 0.15; 
            const x = 0;
            return optionalTarget.set(x, y, z);
        }
    }

    const windGeo = new THREE.TubeGeometry(new WavyWindCurve(), 30, 0.02, 4, false);
    const windMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
    
    const particleCount = 80; 
    const windLines = new THREE.InstancedMesh(windGeo, windMat, particleCount);
    scene.add(windLines);

    const windData = [];
    const dummy = new THREE.Object3D();
    const boxSize = 40; 

    for(let i=0; i < particleCount; i++) {
        const x = (Math.random() - 0.5) * boxSize;
        const y = (Math.random() * 8) - 1; 
        const z = (Math.random() - 0.5) * boxSize;
        
        windData.push({ x, y, z });
        
        dummy.position.set(x, y, z);
        dummy.updateMatrix();
        windLines.setMatrixAt(i, dummy.matrix);
    }

    // ==========================================
    // LOGIC & UI INTEGRATION
    // ==========================================
    let targetTargets = { fl: 0, fr: 0, rl: 0, rr: 0, sr: 0 };
    let currentDrops = { fl: 0, fr: 0, rl: 0, rr: 0, sr: 0 };
    
    const BASE_Y = 1.0; 
    const MAX_DROP = 1.0; 
    const SR_BASE_Z = 0.25; 
    const SR_MAX_SLIDE = -1.25; 

    const modeSelect = document.getElementById('ai-mode');
    const speedSlider = document.getElementById('speed-slider');
    const windSlider = document.getElementById('wind-angle');
    const telemetryGrid = document.getElementById('telemetry-grid-container');
    
    const uiIds = ['fl', 'fr', 'rl', 'rr', 'sr'];
    
    let overrideLocks = { fl: false, fr: false, rl: false, rr: false, sr: false };
    let debounceTimer;

    function getLocks() {
        let locks = {};
        const isAntiBuffeting = modeSelect.value === 'anti_buffeting';
        uiIds.forEach(id => {
            locks[id] = {
                isLocked: isAntiBuffeting && overrideLocks[id],
                val: parseFloat(document.getElementById(`manual-${id}`).value)
            };
        });
        return locks;
    }

    function toggleOverrideVisibility(mode) {
        if (mode === 'anti_buffeting') {
            telemetryGrid.classList.add('show-overrides');
        } else {
            telemetryGrid.classList.remove('show-overrides');
            uiIds.forEach(id => overrideLocks[id] = false);
        }
    }

    uiIds.forEach(id => {
        const slider = document.getElementById(`manual-${id}`);
        slider.addEventListener('input', (e) => {
            if(modeSelect.value === 'anti_buffeting') {
                overrideLocks[id] = true;
            }
            scheduleUpdate(); 
        });
    });

    async function updateLogic() {
        const mode = modeSelect.value;
        const speed = parseFloat(speedSlider.value);
        const windAngle = parseFloat(windSlider.value);
        const windSpeed = 20; 
        const apiKey = document.getElementById('api-key').value.trim();

        document.getElementById('speed-val').innerText = speed;
        document.getElementById('wind-val').innerText = windAngle + '°';
        toggleOverrideVisibility(mode);

        const locks = getLocks();

        if (!apiKey) {
            document.getElementById('api-indicator').className = 'status-dot';
            applyData(physicsEngine.solveApertures(mode, speed, windSpeed, windAngle, locks));
            return;
        }

        document.getElementById('api-indicator').className = 'status-dot processing';
        document.getElementById('thought-process').innerText = "Querying AI Control Module...";

        try {
            const prompt = `
            You are the VectorVent AI Control Module. 
            Vehicle Speed: ${speed} mph
            Ambient Wind: ${windSpeed} mph at ${windAngle} degrees (0 is head-on).
            Intent Mode: ${mode}
            Locked Overrides: ${JSON.stringify(locks)}

            Calculate the optimal window percentages (fl, fr, rl, rr, sr) from 0 to 100.
            If a window is locked (isLocked: true), you MUST return its exact 'val'.
            Compensate for locked windows using the unlocked windows (especially 'sr' sunroof) to prevent resonance.

            Respond ONLY with a valid JSON object matching this exact structure:
            {
              "fl": 0, "fr": 0, "rl": 0, "rr": 0, "sr": 0,
              "cfm": 100,
              "activeState": "Name of aerodynamic state",
              "reasoning": "Short explanation of your aerodynamic choices."
            }
            Do not include markdown blocks like \`\`\`json. Just the raw JSON.`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(`[API Error: ${response.status} - ${errData.error?.message || response.statusText}].`);
            }

            const data = await response.json();
            let aiText = data.candidates[0].content.parts[0].text;
            aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
            
            const parsed = JSON.parse(aiText);

            applyData({
                targets: { fl: parsed.fl, fr: parsed.fr, rl: parsed.rl, rr: parsed.rr, sr: parsed.sr },
                cfm: parsed.cfm,
                activeState: parsed.activeState,
                reasoning: parsed.reasoning
            });
            
            document.getElementById('api-indicator').className = 'status-dot active';

        } catch (error) {
            console.error(error);
            document.getElementById('api-indicator').className = 'status-dot';
            let fallbackData = physicsEngine.solveApertures(mode, speed, windSpeed, windAngle, locks);
            fallbackData.reasoning = `${error.message}\n\n[Fallback Math Engine] ${fallbackData.reasoning}`;
            applyData(fallbackData);
        }
    }

    function applyData(data) {
        targetTargets = data.targets;
        document.getElementById('calc-state').innerText = data.activeState;
        document.getElementById('calc-state').style.color = "#10b981";
        document.getElementById('cfm-rate').innerText = data.cfm > 0 ? data.cfm + " CFM" : "Acoustic Damping";
        document.getElementById('thought-process').innerText = data.reasoning;

        const isAntiBuffeting = modeSelect.value === 'anti_buffeting';
        uiIds.forEach(id => {
            if(!overrideLocks[id] || !isAntiBuffeting) {
                document.getElementById(`manual-${id}`).value = Math.round(targetTargets[id]);
            }
        });
    }

    function scheduleUpdate() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updateLogic, 600); 
    }

    modeSelect.addEventListener('change', () => {
        uiIds.forEach(id => overrideLocks[id] = false);
        scheduleUpdate();
    });
    speedSlider.addEventListener('input', scheduleUpdate);
    windSlider.addEventListener('input', scheduleUpdate);
    document.getElementById('api-key').addEventListener('input', scheduleUpdate);

    updateLogic();

    // ==========================================
    // ANIMATION LOOP
    // ==========================================
    function animate() {
        requestAnimationFrame(animate);
        
        try {
            if (controls) controls.update();

            const lerpFactor = 0.08;
            currentDrops.fl += (targetTargets.fl - currentDrops.fl) * lerpFactor;
            currentDrops.fr += (targetTargets.fr - currentDrops.fr) * lerpFactor;
            currentDrops.rl += (targetTargets.rl - currentDrops.rl) * lerpFactor;
            currentDrops.rr += (targetTargets.rr - currentDrops.rr) * lerpFactor;
            currentDrops.sr += (targetTargets.sr - currentDrops.sr) * lerpFactor;

            windows.fl.position.y = BASE_Y - (currentDrops.fl / 100) * MAX_DROP;
            windows.fr.position.y = BASE_Y - (currentDrops.fr / 100) * MAX_DROP;
            windows.rl.position.y = BASE_Y - (currentDrops.rl / 100) * MAX_DROP;
            windows.rr.position.y = BASE_Y - (currentDrops.rr / 100) * MAX_DROP;
            
            windows.sr.position.z = SR_BASE_Z - (currentDrops.sr / 100) * Math.abs(SR_BASE_Z - SR_MAX_SLIDE);

            document.getElementById('disp-fl').innerText = Math.round(currentDrops.fl) + "%";
            document.getElementById('disp-fr').innerText = Math.round(currentDrops.fr) + "%";
            document.getElementById('disp-rl').innerText = Math.round(currentDrops.rl) + "%";
            document.getElementById('disp-rr').innerText = Math.round(currentDrops.rr) + "%";
            document.getElementById('disp-sr').innerText = Math.round(currentDrops.sr) + "%";

            const speed = parseFloat(speedSlider.value) / 100;
            const angleRad = parseFloat(windSlider.value) * (Math.PI / 180);
            
            const windDirX = -Math.sin(angleRad);
            const windDirZ = -Math.cos(angleRad);
            const lineYaw = Math.atan2(windDirX, windDirZ);
            
            // 30% slowed speed multiplier applied here
            const speedMultiplier = (((speed * 0.8) + 0.1) * 0.3) * 0.7;
            const halfBox = boxSize / 2;

            for(let i = 0; i < particleCount; i++) {
                let p = windData[i];

                p.x += windDirX * speedMultiplier;
                p.z += windDirZ * speedMultiplier;
                
                const distToCarCenter = Math.sqrt(p.x*p.x + p.z*p.z);
                if(distToCarCenter < 4 && p.y > -1 && p.y < 3) {
                    p.x += (Math.random() - 0.5) * 0.1;
                    p.y += (Math.random() - 0.1) * 0.1;
                }

                if (p.x > halfBox) p.x -= boxSize;
                if (p.x < -halfBox) p.x += boxSize;
                if (p.z > halfBox) p.z -= boxSize;
                if (p.z < -halfBox) p.z += boxSize;
                
                if (p.y > 15) p.y = -1;
                if (p.y < -1.5) p.y = 15;

                dummy.position.set(p.x, p.y, p.z);
                dummy.rotation.y = lineYaw;
                dummy.updateMatrix();
                windLines.setMatrixAt(i, dummy.matrix);
            }
            
            windLines.instanceMatrix.needsUpdate = true;
            renderer.render(scene, camera);
            
        } catch (e) {
            console.error("Animation loop error:", e);
        }
    }
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.setViewOffset(window.innerWidth, window.innerHeight, 0, window.innerHeight * 0.1, window.innerWidth, window.innerHeight);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>

</body>
