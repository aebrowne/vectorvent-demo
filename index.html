<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VectorVent - 3D Airflow & Physics Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Daytime Sky Blue */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f3f4f6;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Floating UI Panels */
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: absolute;
            z-index: 10;
        }

        /* Top Center Telemetry Overlay */
        #ui-telemetry {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px 24px;
            min-width: 650px;
            pointer-events: auto;
        }
        .telemetry-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
        }
        .telemetry-item { display: flex; flex-direction: column; align-items: center; gap: 4px; border-right: 1px solid #374151; padding: 0 10px; }
        .telemetry-item:last-child { border-right: none; }
        .telemetry-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; font-weight: bold; text-align: center; }
        .telemetry-value { font-size: 20px; font-family: monospace; font-weight: 600; color: #38bdf8; }
        .cfm-display { font-size: 11px; color: #f59e0b; font-weight: bold; text-transform: uppercase; margin-top: 4px; border-top: 1px solid #374151; padding-top: 6px; text-align: center; }

        /* Expandable Manual Overrides Container inside Telemetry */
        #manual-overrides-container {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            border-top: 1px solid #374151;
            padding-top: 10px;
            margin-top: 4px;
        }
        #manual-overrides-container.active {
            display: grid;
        }
        .override-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .override-control label {
            font-size: 9px;
            color: #60a5fa;
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .override-control input[type="range"] {
            width: 100%;
            height: 4px;
        }

        /* Bottom Left Controls (Compact) */
        #ui-controls {
            bottom: 20px;
            left: 20px;
            width: 260px;
            padding: 14px;
            pointer-events: auto;
        }

        h1 { margin: 0 0 3px 0; font-size: 13px; font-weight: 600; color: #60a5fa; text-transform: uppercase; }
        p { font-size: 10px; color: #9ca3af; margin-bottom: 12px; line-height: 1.3; }
        
        .control-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; font-weight: 700; display: flex; justify-content: space-between; }
        select, input[type="range"] { width: 100%; background: #374151; border: 1px solid #4b5563; color: white; padding: 6px; border-radius: 4px; outline: none; font-size: 11px; }
        select:focus { border-color: #3b82f6; }
        
        hr { border: 0; border-top: 1px solid #374151; margin: 10px 0; }

        /* AI Thought Process Box */
        .thought-box {
            font-size: 10px;
            color: #10b981;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 4px;
            font-family: monospace;
            max-height: 50px;
            overflow-y: auto;
            margin-top: 6px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Instructions on Ground Plane */
        #instructions-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: #1f2937;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
        }

        /* ==========================================
           MOBILE RESPONSIVENESS FIXES
           ========================================== */
        @media (max-width: 768px) {
            #ui-telemetry {
                min-width: 90%;
                width: 95%;
                padding: 10px;
                top: 10px;
            }
            .telemetry-row {
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
            }
            .telemetry-item {
                border-right: none;
                padding: 0 5px;
            }
            .telemetry-value { font-size: 16px; }
            
            #manual-overrides-container {
                grid-template-columns: repeat(3, 1fr);
            }

            #ui-controls {
                width: 90%;
                left: 5%;
                bottom: 10px;
                max-height: 40vh;
                overflow-y: auto;
                padding: 10px;
            }
            
            #instructions-overlay {
                bottom: calc(40vh + 20px);
                font-size: 11px;
                width: 100%;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- TOP TELEMETRY & EXPANDABLE MANUAL OVERRIDES -->
    <div id="ui-telemetry" class="glass-panel">
        <div class="telemetry-row">
            <div class="telemetry-item">
                <span class="telemetry-label">Front Left</span>
                <span class="telemetry-value" id="disp-fl">0%</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Front Right</span>
                <span class="telemetry-value" id="disp-fr">0%</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Rear Left</span>
                <span class="telemetry-value" id="disp-rl">0%</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Rear Right</span>
                <span class="telemetry-value" id="disp-rr">0%</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Sunroof</span>
                <span class="telemetry-value" id="disp-sr">0%</span>
            </div>
        </div>
        
        <!-- Expandable Manual Overrides for Anti-Buffeting Mode -->
        <div id="manual-overrides-container">
            <div class="override-control">
                <label><input type="checkbox" id="lock-fl"> Lock FL</label>
                <input type="range" id="slider-fl" min="0" max="100" value="0">
            </div>
            <div class="override-control">
                <label><input type="checkbox" id="lock-fr"> Lock FR</label>
                <input type="range" id="slider-fr" min="0" max="100" value="0">
            </div>
            <div class="override-control">
                <label><input type="checkbox" id="lock-rl"> Lock RL</label>
                <input type="range" id="slider-rl" min="0" max="100" value="0">
            </div>
            <div class="override-control">
                <label><input type="checkbox" id="lock-rr"> Lock RR</label>
                <input type="range" id="slider-rr" min="0" max="100" value="0">
            </div>
            <div class="override-control">
                <label><input type="checkbox" id="lock-sr"> Lock SR</label>
                <input type="range" id="slider-sr" min="0" max="100" value="0">
            </div>
        </div>

        <div class="cfm-display" id="cfm-rate">CFM Exchange Rate: 340 CFM | State: High-Velocity Cross-Flow</div>
    </div>

    <!-- BOTTOM LEFT CONTROLS -->
    <div id="ui-controls" class="glass-panel">
        <h1>VectorVent Engine</h1>
        <p>Intent-driven CFDE multi-axis control.</p>
        
        <div class="control-group">
            <label for="ai-mode">AI Intent Mode</label>
            <select id="ai-mode">
                <option value="smoke_evac">Targeted Smoke/Odor Evacuation</option>
                <option value="anti_buffeting">Active Anti-Buffeting</option>
                <option value="gentle_breeze">Gentle Cabin Breeze</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="speed-slider">Vehicle Speed (MPH): <span id="speed-val">65</span></label>
            <input type="range" id="speed-slider" min="0" max="100" step="5" value="65">
        </div>
        
        <div class="control-group">
            <label for="wind-angle">Ambient Wind Angle: <span id="wind-val">45°</span></label>
            <input type="range" id="wind-angle" min="0" max="360" step="15" value="45">
        </div>

        <hr>

        <div class="control-group">
            <label for="api-key-input">Gemini API Key <span id="api-status" style="color:#ef4444;">●</span></label>
            <input type="password" id="api-key-input" placeholder="Optional (Uses built-in env key if blank)">
        </div>

        <div class="control-group">
            <label>AI Thought Process</label>
            <div id="thought-process" class="thought-box">Local physics engine active. Ready for API stream...</div>
        </div>
    </div>

    <!-- INSTRUCTIONS OVERLAY ON GROUND -->
    <div id="instructions-overlay">
        Click & Drag canvas to rotate camera. Scroll to zoom.
    </div>

    <!-- 3D CANVAS -->
    <div id="canvas-container"></div>

<script>
    // =======================================================
    // 1. THE PHYSICS ENGINE (Math & Fluid Dynamics)
    // =======================================================
    class VectorVentPhysics {
        constructor() {
            this.windowNormals = {
                fl: this.normalize([-1.0,  0.15]), 
                fr: this.normalize([ 1.0,  0.15]), 
                rl: this.normalize([-1.0, -0.05]), 
                rr: this.normalize([ 1.0, -0.05]),
                sr: [0, 0] // Top suction
            };
        }

        normalize(vec) {
            const mag = Math.sqrt(vec[0]*vec[0] + vec[1]*vec[1]);
            return [vec[0]/mag, vec[1]/mag];
        }

        dotProduct(v1, v2) {
            return (v1[0] * v2[0]) + (v1[1] * v2[1]);
        }

        calculateRelativeWind(vehSpeed, windSpeed, windAngleDeg) {
            const vVeh = [0, vehSpeed];
            const windRad = windAngleDeg * (Math.PI / 180);
            const vAmbient = [
                -windSpeed * Math.sin(windRad), 
                -windSpeed * Math.cos(windRad)
            ];
            const vRel = [
                vVeh[0] - vAmbient[0], 
                vVeh[1] - vAmbient[1]
            ];
            const relSpeed = Math.sqrt(vRel[0]*vRel[0] + vRel[1]*vRel[1]);
            const relDir = this.normalize(vRel);

            return { speed: relSpeed, direction: relDir };
        }

        calculatePressures(relWindDir) {
            let cpMap = {};
            for (let window in this.windowNormals) {
                if(window === 'sr') continue;
                const normal = this.windowNormals[window];
                cpMap[window] = this.dotProduct(relWindDir, normal);
            }
            return cpMap;
        }

        solveApertures(mode, vehSpeed, windSpeed, windAngleDeg, locks = {}, userValues = {}) {
            const relWind = this.calculateRelativeWind(vehSpeed, windSpeed, windAngleDeg);
            const cpMap = this.calculatePressures(relWind.direction);
            
            let targets = { fl: 0, fr: 0, rl: 0, rr: 0, sr: 0 };
            let cfm = 0;
            let activeState = "";
            let reasoning = "";

            const leftIsWindward = cpMap.fl > cpMap.fr;

            if (mode === 'smoke_evac') {
                activeState = "High-Velocity Cross-Flow Vacuum";
                if (leftIsWindward) {
                    targets.fl = 15; 
                    targets.rr = 60 + (Math.abs(cpMap.rr) * 20);
                    targets.sr = 40;
                } else {
                    targets.fr = 15; 
                    targets.rl = 60 + (Math.abs(cpMap.rl) * 20);
                    targets.sr = 40;
                }
                cfm = Math.floor(relWind.speed * 5.2);
                reasoning = "Established cross-flow vacuum via side windows while utilizing sunroof top-suction for rapid volumetric extraction.";
            } 
            else if (mode === 'anti_buffeting') {
                activeState = "Autonomous Anti-Buffeting & Balancing";
                const baseDrop = Math.min(10, Math.max(3, relWind.speed * 0.08));
                
                // Base AI calculation
                targets = { fl: baseDrop, fr: baseDrop, rl: baseDrop, rr: baseDrop, sr: baseDrop * 1.5 };

                // Apply manual locks and autonomous compensation for remaining windows
                let lockedCount = 0;
                for (let k in locks) {
                    if (locks[k]) {
                        targets[k] = userValues[k];
                        lockedCount++;
                    }
                }

                if (lockedCount > 0) {
                    // If user forces a window wide open, dynamically adjust sunroof/other windows to suppress resonance
                    if ((locks.fl && userValues.fl > 40) || (locks.fr && userValues.fr > 40)) {
                        targets.sr = Math.min(100, 70 + (lockedCount * 10));
                        reasoning = `Autonomous compensation: User lock detected. Modulating Sunroof to ${Math.round(targets.sr)}% to suppress Helmholtz cavity resonance.`;
                    } else {
                        reasoning = `Autonomous Anti-Buffeting active with ${lockedCount} user override(s). Non-locked apertures modulated for pressure equilibrium.`;
                    }
                } else {
                    reasoning = "All apertures under AI helmholtz suppression control. Mitigating low-frequency standing pressure waves.";
                }

                cfm = Math.floor(relWind.speed * 2.1);
            }
            else if (mode === 'gentle_breeze') {
                activeState = "Low-Velocity Circulation";
                if (leftIsWindward) {
                    targets.fr = 12; targets.rl = 8; targets.sr = 15;
                } else {
                    targets.fl = 12; targets.rr = 8; targets.sr = 15;
                }
                cfm = Math.floor(relWind.speed * 1.8);
                reasoning = "Leeward induction pairing with top sunroof venting for comfortable low-velocity cabin air turnover.";
            }

            for(let key in targets) {
                targets[key] = Math.max(0, Math.min(100, targets[key]));
            }

            return { targets, cfm, activeState, reasoning };
        }
    }

    const physicsEngine = new VectorVentPhysics();

    // =======================================================
    // 2. THREE.JS 3D SCENE SETUP
    // =======================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sky blue
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // Dynamic Camera Distance for Mobile vs Desktop
    if (window.innerWidth < 768) {
        camera.position.set(-22, 11, 25);
    } else {
        camera.position.set(-14, 7, 16);
    }
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Reposition Horizon Line to 4/10ths from top of page
    const heightOffset = window.innerHeight * 0.1; // Shift optical center down
    camera.setViewOffset(window.innerWidth, window.innerHeight, 0, -heightOffset, window.innerWidth, window.innerHeight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 8;
    controls.maxDistance = 35;
    controls.target.set(0, 0.5, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(20, 30, 20);
    scene.add(dirLight);

    // Daytime Ground & Road Environment
    const planeGeo = new THREE.PlaneGeometry(500, 500);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.9 });
    const grassPlane = new THREE.Mesh(planeGeo, grassMat);
    grassPlane.rotation.x = -Math.PI / 2;
    grassPlane.position.y = -1.21;
    scene.add(grassPlane);

    const roadGeo = new THREE.PlaneGeometry(12, 500);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
    const roadPlane = new THREE.Mesh(roadGeo, roadMat);
    roadPlane.rotation.x = -Math.PI / 2;
    roadPlane.position.set(0, -1.2, 0);
    scene.add(roadPlane);

    // Road Stripe
    const stripeGeo = new THREE.PlaneGeometry(0.4, 500);
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
    const stripe = new THREE.Mesh(stripeGeo, stripeMat);
    stripe.rotation.x = -Math.PI / 2;
    stripe.position.set(0, -1.19, 0);
    scene.add(stripe);

    // ==========================================
    // DETAILED CAR MODEL & 5-APERTURE ASSEMBLY
    // ==========================================
    const carGroup = new THREE.Group();
    scene.add(carGroup);
    
    const chassisMat = new THREE.MeshStandardMaterial({ 
        color: 0x9ca3af, metalness: 0.6, roughness: 0.4, 
        transparent: true, opacity: 0.4 
    });
    
    const windowMat = new THREE.MeshStandardMaterial({ 
        color: 0x3b82f6, metalness: 0.9, roughness: 0.1, 
        transparent: true, opacity: 0.85, emissive: 0x1d4ed8, emissiveIntensity: 0.4, side: THREE.DoubleSide
    });

    const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); 
    const taillightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 

    // Chassis Body
    const bodyGeo = new THREE.BoxGeometry(4.2, 1.2, 10);
    const bodyMesh = new THREE.Mesh(bodyGeo, chassisMat);
    bodyMesh.position.y = -0.3;
    carGroup.add(bodyMesh);

    // Hollowed Cabin Frame (No internal blocking)
    const roofRailGeo = new THREE.BoxGeometry(0.2, 0.1, 5.5);
    const leftRoofRail = new THREE.Mesh(roofRailGeo, chassisMat);
    leftRoofRail.position.set(1.7, 1.7, -0.5);
    const rightRoofRail = new THREE.Mesh(roofRailGeo, chassisMat);
    rightRoofRail.position.set(-1.7, 1.7, -0.5);
    carGroup.add(leftRoofRail, rightRoofRail);

    // Perfectly Mating Windshields
    const windshieldGeo = new THREE.PlaneGeometry(3.4, 1.5);
    const windshield = new THREE.Mesh(windshieldGeo, windowMat);
    windshield.position.set(0, 1.0, 2.25);
    windshield.rotation.x = -0.62;
    carGroup.add(windshield);

    const rearWindow = new THREE.Mesh(windshieldGeo, windowMat);
    rearWindow.position.set(0, 1.0, -3.25);
    rearWindow.rotation.x = 0.62;
    carGroup.add(rearWindow);

    // 4 Dynamic Side Windows
    const sideWindowGeo = new THREE.PlaneGeometry(2.4, 1.1);
    const windows = {
        fl: new THREE.Mesh(sideWindowGeo, windowMat),
        fr: new THREE.Mesh(sideWindowGeo, windowMat),
        rl: new THREE.Mesh(sideWindowGeo, windowMat),
        rr: new THREE.Mesh(sideWindowGeo, windowMat)
    };

    windows.fl.position.set(1.81, 0.95, 0.8);
    windows.fl.rotation.y = Math.PI / 2;
    windows.fr.position.set(-1.81, 0.95, 0.8);
    windows.fr.rotation.y = -Math.PI / 2;
    
    windows.rl.position.set(1.81, 0.95, -1.8);
    windows.rl.rotation.y = Math.PI / 2;
    windows.rr.position.set(-1.81, 0.95, -1.8);
    windows.rr.rotation.y = -Math.PI / 2;

    carGroup.add(windows.fl, windows.fr, windows.rl, windows.rr);

    // 5th Aperture: Split-Pane Sunroof with Thin Border Frames
    const srWidth = 2.0;
    const srLength = 1.5;
    const srPaneGeo = new THREE.PlaneGeometry(srWidth, srLength);
    
    // Fixed Rear Sunroof Pane
    const srFixed = new THREE.Mesh(srPaneGeo, windowMat);
    srFixed.rotation.x = -Math.PI / 2;
    srFixed.position.set(0, 1.76, -0.75);
    carGroup.add(srFixed);

    // Moving Front Sunroof Pane
    const srMoving = new THREE.Mesh(srPaneGeo, windowMat);
    srMoving.rotation.x = -Math.PI / 2;
    srMoving.position.set(0, 1.76, 0.75);
    carGroup.add(srMoving);

    // Sunroof Frames / Borders
    const frameMat = new THREE.MeshBasicMaterial({ color: 0x111111, wireframe: true });
    const srFrameGeo = new THREE.BoxGeometry(srWidth + 0.05, 0.02, srLength + 0.05);
    const fixedFrame = new THREE.Mesh(srFrameGeo, frameMat);
    fixedFrame.position.set(0, 1.77, -0.75);
    const movingFrame = new THREE.Mesh(srFrameGeo, frameMat);
    movingFrame.position.set(0, 1.77, 0.75);
    carGroup.add(fixedFrame, movingFrame);

    // Wheels & Lights
    const wheelGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.4, 32);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelPositions = [
        [-2.1, -1.0, 3.0], [2.1, -1.0, 3.0],
        [-2.1, -1.0, -3.0], [2.1, -1.0, -3.0]
    ];
    wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, blackMat);
        wheel.position.set(...pos);
        carGroup.add(wheel);
    });

    const hlGeo = new THREE.BoxGeometry(0.8, 0.4, 0.1);
    const frontLeftLight = new THREE.Mesh(hlGeo, headlightMat);
    frontLeftLight.position.set(1.3, -0.1, 5.01);
    const frontRightLight = new THREE.Mesh(hlGeo, headlightMat);
    frontRightLight.position.set(-1.3, -0.1, 5.01);
    carGroup.add(frontLeftLight, frontRightLight);

    const tlGeo = new THREE.BoxGeometry(1.0, 0.3, 0.1);
    const rearLeftLight = new THREE.Mesh(tlGeo, taillightMat);
    rearLeftLight.position.set(1.4, -0.1, -5.01);
    const rearRightLight = new THREE.Mesh(tlGeo, taillightMat);
    rearRightLight.position.set(-1.4, -0.1, -5.01);
    carGroup.add(rearLeftLight, rearRightLight);

    // ==========================================
    // WAVY AERODYNAMIC WIND LINES (Instanced TubeGeometry)
    // ==========================================
    const curveCount = 80; 
    const curveLengthPoints = 20;
    const curvePath = [];
    for(let i=0; i<curveLengthPoints; i++) {
        curvePath.push(new THREE.Vector3(0, 0, (i / (curveLengthPoints - 1)) * 10 - 5));
    }
    const baseCurve = new THREE.CatmullRomCurve3(curvePath);
    const tubeGeo = new THREE.TubeGeometry(baseCurve, 15, 0.08, 6, false);
    const tubeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.8, transparent: true, opacity: 0.75 });
    
    const windInstancedMesh = new THREE.InstancedMesh(tubeGeo, tubeMat, curveCount);
    scene.add(windInstancedMesh);

    const dummy = new THREE.Object3D();
    const windParticlesData = [];
    const boxBoundary = 35;

    for(let i=0; i<curveCount; i++) {
        windParticlesData.push({
            x: (Math.random() - 0.5) * boxBoundary,
            y: Math.random() * 6 - 0.5,
            z: (Math.random() - 0.5) * boxBoundary,
            speedOffset: 0.8 + Math.random() * 0.4,
            waveFreq: 2 + Math.random() * 3,
            waveAmp: 0.2 + Math.random() * 0.3
        });
    }

    // =======================================================
    // 3. UI LOGIC & GEMINI API INTEGRATION
    // =======================================================
    let targetTargets = { fl: 0, fr: 0, rl: 0, rr: 0, sr: 0 };
    let currentDrops = { fl: 0, fr: 0, rl: 0, rr: 0, sr: 0 };
    const BASE_Y = 0.95; 
    const MAX_DROP = 0.9; 

    const modeSelect = document.getElementById('ai-mode');
    const speedSlider = document.getElementById('speed-slider');
    const windSlider = document.getElementById('wind-angle');
    const apiKeyInput = document.getElementById('api-key-input');
    const apiStatus = document.getElementById('api-status');
    const thoughtBox = document.getElementById('thought-process');
    const manualOverridesContainer = document.getElementById('manual-overrides-container');

    // Manual Overrides Checkboxes & Sliders
    const locks = {
        fl: document.getElementById('lock-fl'),
        fr: document.getElementById('lock-fr'),
        rl: document.getElementById('lock-rl'),
        rr: document.getElementById('lock-rr'),
        sr: document.getElementById('lock-sr')
    };
    const sliders = {
        fl: document.getElementById('slider-fl'),
        fr: document.getElementById('slider-fr'),
        rl: document.getElementById('slider-rl'),
        rr: document.getElementById('slider-rr'),
        sr: document.getElementById('slider-sr')
    };

    let debounceTimer = null;

    async function callGeminiAPI(mode, speed, windAngle) {
        const apiKey = apiKeyInput.value.trim();
        apiStatus.style.color = "#f59e0b"; // Processing yellow
        thoughtBox.innerText = "Querying Gemini API for CFDE fluid matrix...";

        const prompt = `You are VectorVent, an advanced automotive AI fluid-dynamics control module. 
        Current State:
        - Mode: ${mode}
        - Vehicle Speed: ${speed} MPH
        - Ambient Wind Angle: ${windAngle}°
        
        Calculate the precise percentage opening for 5 apertures: fl (front-left), fr (front-right), rl (rear-left), rr (rear-right), sr (sunroof).
        Return ONLY a valid JSON object in this exact format, with no markdown formatting:
        {"targets": {"fl": number, "fr": number, "rl": number, "rr": number, "sr": number}, "cfm": number, "reasoning": "short engineering explanation"}`;

        try {
            // Using gemini-3-flash-preview endpoint which is supported in the canvas environment
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent` + (apiKey ? `?key=${apiKey}` : ``);
            
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!response.ok) {
                throw new Error(`API Error: ${response.status} - ${response.statusText}`);
            }

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            
            // Clean markdown blocks if returned
            const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const result = JSON.parse(cleanJson);

            apiStatus.style.color = "#10b981"; // Connected green
            thoughtBox.innerText = result.reasoning;
            return result;

        } catch (err) {
            apiStatus.style.color = "#ef4444"; // Error red
            thoughtBox.innerText = `[API Error: ${err.message}. Using Local Physics Fallback]`;
            return null;
        }
    }

    async function updateLogic() {
        const mode = modeSelect.value;
        const speed = parseFloat(speedSlider.value);
        const windAngle = parseFloat(windSlider.value);
        const windSpeed = 20;

        document.getElementById('speed-val').innerText = speed;
        document.getElementById('wind-val').innerText = windAngle + '°';

        // Toggle Expandable Manual Overrides Panel
        if (mode === 'anti_buffeting') {
            manualOverridesContainer.classList.add('active');
        } else {
            manualOverridesContainer.classList.remove('active');
            for(let k in locks) locks[k].checked = false;
        }

        // Gather lock states & slider values
        let lockStates = {};
        let userVals = {};
        for(let k in locks) {
            lockStates[k] = locks[k].checked;
            sliders[k].disabled = !locks[k].checked;
            userVals[k] = parseFloat(sliders[k].value);
        }

        // Try Gemini API first if key or environment allows
        let aiData = await callGeminiAPI(mode, speed, windAngle);

        if (aiData && aiData.targets) {
            targetTargets = aiData.targets;
            document.getElementById('cfm-rate').innerText = `CFM Exchange Rate: ${aiData.cfm} CFM | State: ${mode.toUpperCase()}`;
        } else {
            // Local Physics Engine Fallback
            const physicsData = physicsEngine.solveApertures(mode, speed, windSpeed, windAngle, lockStates, userVals);
            targetTargets = physicsData.targets;
            document.getElementById('cfm-rate').innerText = `CFM Exchange Rate: ${physicsData.cfm} CFM | State: ${physicsData.activeState}`;
            thoughtBox.innerText = physicsData.reasoning;
        }
    }

    // Debouncer for smooth slider interaction
    function triggerDebouncedUpdate() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updateLogic, 400);
    }

    modeSelect.addEventListener('change', updateLogic);
    speedSlider.addEventListener('input', () => { document.getElementById('speed-val').innerText = speedSlider.value; triggerDebouncedUpdate(); });
    windSlider.addEventListener('input', () => { document.getElementById('wind-val').innerText = windSlider.value + '°'; triggerDebouncedUpdate(); });
    
    for(let k in locks) {
        locks[k].addEventListener('change', updateLogic);
        sliders[k].addEventListener('input', updateLogic);
    }

    updateLogic();

    // =======================================================
    // 4. ANIMATION LOOP
    // =======================================================
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        const time = clock.getElapsedTime();

        // Smooth window drops lerp
        const lerpFactor = 0.08;
        currentDrops.fl += (targetTargets.fl - currentDrops.fl) * lerpFactor;
        currentDrops.fr += (targetTargets.fr - currentDrops.fr) * lerpFactor;
        currentDrops.rl += (targetTargets.rl - currentDrops.rl) * lerpFactor;
        currentDrops.rr += (targetTargets.rr - currentDrops.rr) * lerpFactor;
        currentDrops.sr += (targetTargets.sr - currentDrops.sr) * lerpFactor;

        windows.fl.position.y = BASE_Y - (currentDrops.fl / 100) * MAX_DROP;
        windows.fr.position.y = BASE_Y - (currentDrops.fr / 100) * MAX_DROP;
        windows.rl.position.y = BASE_Y - (currentDrops.rl / 100) * MAX_DROP;
        windows.rr.position.y = BASE_Y - (currentDrops.rr / 100) * MAX_DROP;
        
        // Sunroof sliding range limit
        const srSlideOffset = (currentDrops.sr / 100) * 1.5;
        srMoving.position.z = 0.75 - srSlideOffset;
        movingFrame.position.z = 0.75 - srSlideOffset;

        // Telemetry readouts update
        document.getElementById('disp-fl').innerText = Math.round(currentDrops.fl) + "%";
        document.getElementById('disp-fr').innerText = Math.round(currentDrops.fr) + "%";
        document.getElementById('disp-rl').innerText = Math.round(currentDrops.rl) + "%";
        document.getElementById('disp-rr').innerText = Math.round(currentDrops.rr) + "%";
        document.getElementById('disp-sr').innerText = Math.round(currentDrops.sr) + "%";

        // Wavy Wind Particles Physics 
        const speed = (parseFloat(speedSlider.value) / 100) * 0.7; 
        const angleRad = parseFloat(windSlider.value) * (Math.PI / 180);
        
        const windDirX = -Math.sin(angleRad);
        const windDirZ = -Math.cos(angleRad);
        const speedMultiplier = (speed * 0.7) + 0.08;

        for(let i = 0; i < curveCount; i++) {
            let p = windParticlesData[i];

            p.x += windDirX * speedMultiplier;
            p.z += windDirZ * speedMultiplier;

            // Boundary wrapping
            if (p.x > boxBoundary) p.x -= boxBoundary * 2;
            if (p.x < -boxBoundary) p.x += boxBoundary * 2;
            if (p.z > boxBoundary) p.z -= boxBoundary * 2;
            if (p.z < -boxBoundary) p.z += boxBoundary * 2;

            // Wavy sine oscillation along trajectory
            const waveX = p.x + Math.sin(time * p.waveFreq + i) * p.waveAmp;
            const waveY = p.y + Math.cos(time * p.waveFreq * 0.8 + i) * (p.waveAmp * 0.5);

            dummy.position.set(waveX, waveY, p.z);
            dummy.scale.set(1, 1, speedMultiplier * 4);
            dummy.rotation.set(0, angleRad, 0);
            dummy.updateMatrix();

            windInstancedMesh.setMatrixAt(i, dummy.matrix);
        }
        windInstancedMesh.instanceMatrix.needsUpdate = true;

        renderer.render(scene, camera);
    }
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        
        // Dynamically update camera for mobile resizing
        if (window.innerWidth < 768) {
            camera.position.set(-22, 11, 25);
        } else {
            camera.position.set(-14, 7, 16);
        }
        
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        const hOffset = window.innerHeight * 0.1;
        camera.setViewOffset(window.innerWidth, window.innerHeight, 0, -hOffset, window.innerWidth, window.innerHeight);
    });

    animate();
</script>

</body>
